name: imf_reporting
version: "1.0.0"
config-version: 2
profile: imf_reporting

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target"]

models:
  imf_reporting:
    silver:
      +materialized: table
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

vars:
  # Écart toléré par agence au rapprochement, en part de l'encours comptable de l'agence
  seuil_ecart_rapprochement: 0.005
  # Nombre de derniers arrêtés mensuels rapprochés
  nb_dates_rapprochement: 3
